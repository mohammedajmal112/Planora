name: Update news and deploy Planora

on:
  workflow_dispatch:
  schedule:
    - cron: "17 */6 * * *"

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Fetch technology headlines
        env:
          GNEWS_API_KEY: ${{ secrets.GNEWS_API_KEY }}
        run: |
          if [ -z "$GNEWS_API_KEY" ]; then
            echo "Set the GNEWS_API_KEY repository Actions secret before running this workflow."
            exit 1
          fi

          mkdir -p dist
          curl --fail-with-body --silent --show-error --get \
            "https://gnews.io/api/v4/top-headlines" \
            --data-urlencode "category=technology" \
            --data-urlencode "lang=en" \
            --data-urlencode "country=in" \
            --data-urlencode "max=10" \
            --data-urlencode "apikey=$GNEWS_API_KEY" \
            --output dist/news.json

          node -e 'const data = require("./dist/news.json"); if (!Array.isArray(data.articles)) { console.error("GNews response does not contain an articles array"); process.exit(1); }'

      - name: Prepare Pages artifact
        run: cp index.html script.js style.css dist/

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
