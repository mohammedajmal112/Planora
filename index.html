<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planora</title>
    <link rel="stylesheet" href="/style.css"> 
</head>
<body>
    <nav aria-label="Main navigation">
        <a class="brand" href="/index.html" aria-label="Planora home">
            <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="none" aria-hidden="true">
                <g stroke="#f3f5f8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
                    <rect x="7" y="8" width="34" height="28" rx="4"/>
                    <path d="M16 5v6M32 5v6M7 16h34M14 24h5M14 30h5M26 24l3 3 6-7"/>
                </g>
            </svg>
            <span class="brand-title">Planora</span>
        </a>
    </nav>
    <main>
        <section class="main-section-container">
            <article class="grid-box">
                <h2 class="current-time">10:45</h2>
            </article>
            <article class="grid-box weather-card">
                <div class="current-climate">
                    <svg class="weather-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="none" aria-hidden="true">
                        <g stroke="rgb(20, 110, 237)" stroke-linecap="round" stroke-width="1.5">
                            <path d="M25 5V2M14 9l-2-2M36 9l2-2M40 19l3 1" stroke="yellow"/>
                            <circle cx="25" cy="17" r="8" fill="yellow"/>
                            <path d="M17 31H9a6 6 0 0 1-.7-12 9 9 0 0 1 17.1 1.7A5.2 5.2 0 0 1 25 31h-8Z" fill="#f3f5f8"/>
                        </g>
                    </svg>
                    <span>25&deg;C</span>
                </div>
                <div class="weather-details">
                    <h2 class="weather-name">Sunny</h2>
                    <h2 class="weather-location">Sydney</h2>
                </div>
            </article>
            <article class="grid-box grid-box-wide">
                <h2>Task overview</h2>
            </article>
        </section>
        <section class="main-sidebar-container">

        </section>
    </main>
</body>
</html>
