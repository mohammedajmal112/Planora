<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Planora</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>
    <nav aria-label="Main navigation">
        <a class="brand" href="index.html" aria-label="Planora home">
            <svg class="brand-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 40" fill="none" aria-hidden="true">
                <g stroke="#f3f5f8" stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5">
                    <rect x="7" y="8" width="34" height="28" rx="4"/>
                    <path d="M16 5v6M32 5v6M7 16h34M14 24h5M14 30h5M26 24l3 3 6-7"/>
                </g>
            </svg>
            <span class="brand-title">Planora</span>
        </a>
    </nav>
    <main>
        <section class="main-section-container">
            <article class="grid-box">
                <time class="current-time" id="current-time"></time>
            </article>
            <article class="grid-box weather-card">
                <div class="current-climate">
                    <span class="weather-icon" id="weather-icon" aria-hidden="true">⛅</span>
                    <span id="weather-temperature">--&deg;C</span>
                </div>
                <div class="weather-details">
                    <h2 class="weather-name" id="weather-condition">Loading weather...</h2>
                    <h2 class="weather-location" id="weather-location">Chennai</h2>
                </div>
                <button class="location-button" id="use-location" type="button">Use my location</button>
                <p class="weather-status" id="weather-status" role="status" aria-live="polite"></p>
            </article>
            <article class="grid-box grid-box-wide todo-card">
                <h2 class="todo-title">To-do</h2>
                <p class="todo-status" id="todo-status" role="status" aria-live="polite"></p>
                <ul class="todo-list" id="todo-list"></ul>
                <form class="todo-form" id="todo-form">
                    <input id="todo-input" type="text" placeholder="Add item" aria-label="Add a to-do item" required>
                    <button type="submit">Add</button>
                </form>
            </article>
        </section>
        <section class="main-sidebar-container" aria-labelledby="feed-heading">
            <h2 class="feed-reader" id="feed-heading">Feed Reader</h2>
            <p id="feed-status" class="feed-status" role="status" aria-live="polite">Loading headlines...</p>
            <div id="feed-list"></div>
        </section>
    </main>
</body>
</html>
